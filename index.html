<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"

content="width=device-width,initial-scale=1.0,viewport-fit=cover">

<title>EMDO 12周年ガチャ</title>

<style>

*{

margin:0;

padding:0;

box-sizing:border-box;

-webkit-tap-highlight-color:transparent;

user-select:none;

}

html,

body{

width:100%;

height:100%;

overflow:hidden;

background:#000;

font-family:sans-serif;
}

#app{

position:fixed;

left:0;

top:0;

width:100%;

height:100%;

overflow:hidden;

}

.screen{

position:absolute;

left:0;

top:0;

width:100%;

height:100%;

display:none;

justify-content:center;

align-items:center;

background:#000;

}

.screen.active{

display:flex;

}

.screen img{

width:100%;

height:100%;

object-fit:cover;

}

#animation{

flex-direction:column;

background:#000;

color:#fff;

}

#roulette{

font-size:40px;

letter-spacing:8px;

animation:flash .18s infinite;

}

#message{

margin-top:30px;

font-size:22px;

}
@keyframes flash{

0%{

opacity:1;

transform:scale(1);

}

50%{

opacity:.2;

transform:scale(1.08);

}

100%{

opacity:1;

transform:scale(1);

}

}



#resetOverlay{

position:fixed;

left:0;

top:0;

width:100%;

height:100%;

background:rgba(0,0,0,.9);

display:none;





#resetBox h2{

font-size:24px;

margin-bottom:20px;

color:#222;

}

#password{

width:100%;

padding:15px;

font-size:24px;

text-align:center;

border:2px solid #ccc;

border-radius:12px;

letter-spacing:10px;

margin-bottom:20px;

}

#resetConfirm{

width:100%;

padding:16px;

font-size:20px;

border:none;

border-radius:12px;

background:#d60000;

color:#fff;

font-weight:bold;

}

#resetCancel{

width:100%;

padding:16px;

margin-top:15px;

font-size:18px;

border:none;

border-radius:12px;

background:#777;

color:#fff;

}

.hidden{

display:none;

}
</style>

</head>

<body>

<div id="app">

<div id="topScreen" class="screen active">

<img src="top.png.PNG" alt="TOP">

</div>

<div id="animation" class="screen">

<div id="roulette">

🎰🎰🎰

</div>

<div id="message">

抽選中…

</div>

</div>

<div id="resultScreen" class="screen">

<img

id="resultImage"

src=""

alt="Result">



</div>

<div id="resetOverlay">
<div id="resetBox">

<h2>

管理者メニュー

</h2>

<input

type="password"

id="password"

maxlength="4"

placeholder="4桁パスコード">

<button id="resetConfirm">

リセットする

</button>

<button id="resetCancel">

キャンセル

</button>

</div>

</div>

</div>

<script>
const topScreen=document.getElementById("topScreen");

const animation=document.getElementById("animation");

const resultScreen=document.getElementById("resultScreen");

const resultImage=document.getElementById("resultImage");



const resetOverlay=document.getElementById("resetOverlay");

const password=document.getElementById("password");

const resetConfirm=document.getElementById("resetConfirm");

const resetCancel=document.getElementById("resetCancel");

let drawCount=

parseInt(localStorage.getItem("drawCount")||"0");

let playing=false;

const prizes={

1:"prize2.png.PNG",

9:"prize3.png.PNG",

18:"prize2.png.PNG",

26:"prize3.png.PNG",

37:"prize3.png.PNG",

46:"prize2.png.PNG",

55:"prize1.png.PNG",

61:"prize3.png.PNG",

68:"prize3.png.PNG",

77:"prize2.png.PNG",

84:"prize3.png.PNG",

92:"prize2.png.PNG",

98:"prize3.png.PNG"

};

function showScreen(screen){

document

.querySelectorAll(".screen")

.forEach(s=>s.classList.remove("active"));

screen.classList.add("active");

}
function getPrize(){

    drawCount++;

    localStorage.setItem("drawCount", drawCount);

    return prizes[drawCount] || "prize4.png.PNG";

}

function startGacha(){

    if(playing) return;

    playing = true;



    showScreen(animation);

    setTimeout(()=>{

        const prize = getPrize();

        resultImage.src = prize;

        showScreen(resultScreen);



        playing = false;

    },2500);

}
topScreen.addEventListener("click",()=>{

    startGacha();





resultImage.addEventListener("click",()=>{

    showScreen(topScreen);

});
let pressTimer;

topScreen.addEventListener("touchstart",()=>{

    pressTimer = setTimeout(()=>{

        resetOverlay.style.display="flex";

        password.value="";

    },5000);

});

topScreen.addEventListener("touchend",()=>{

    clearTimeout(pressTimer);

});

topScreen.addEventListener("touchmove",()=>{

    clearTimeout(pressTimer);

});
resetCancel.addEventListener("click",()=>{

    resetOverlay.style.display="none";

});
resetConfirm.addEventListener("click",()=>{

    if(password.value==="1212"){

        if(confirm("抽選回数をリセットしますか？")){

            drawCount = 0;

            localStorage.setItem("drawCount","0");

            alert("リセットしました！");

            resetOverlay.style.display="none";

        }

    }else{

        alert("パスコードが違います");

    }

});
</script>

</body>

</html>
