<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">

<title>EMDO 12周年ガチャ</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
user-select:none;
}

html,
body{
width:100%;
height:100%;
overflow:hidden;
background:#000;
font-family:sans-serif;
}

#app{
position:fixed;
left:0;
top:0;
width:100%;
height:100%;
}

.screen{
position:absolute;
left:0;
top:0;
width:100%;
height:100%;
display:none;
justify-content:center;
align-items:center;
background:#000;
}

.screen.active{
display:flex;
}

#topImage{
width:100%;
height:100%;
object-fit:contain;
background:#000;
}

#resultImage{
width:100%;
height:100%;
object-fit:cover;
}

#animation{
flex-direction:column;
color:#fff;
}
#gachaMachine{
width:260px;
max-width:75%;
height:auto;
display:block;
margin:0 auto 30px;
}
#roulette{
font-size:48px;
letter-spacing:10px;
animation:flash .18s infinite;
}

#message{
margin-top:25px;
font-size:24px;
font-weight:bold;
}

@keyframes flash{
0%{opacity:1;transform:scale(1);}
50%{opacity:.2;transform:scale(1.08);}
100%{opacity:1;transform:scale(1);}
}

#adminArea{
position:absolute;
left:0;
top:0;
width:60px;
height:60px;
z-index:100;
}

#resetOverlay{
position:fixed;
left:0;
top:0;
width:100%;
height:100%;
display:none;
justify-content:center;
align-items:center;
background:rgba(0,0,0,.85);
z-index:999;
}

#resetBox{
width:85%;
max-width:340px;
background:#fff;
padding:30px;
border-radius:18px;
text-align:center;
}

#resetBox h2{
margin-bottom:20px;
color:#222;
font-size:24px;
}
#countInfo{
margin:15px 0 20px;
font-size:22px;
font-weight:bold;
color:#444;
line-height:1.6;
}
#password{
width:100%;
padding:15px;
font-size:24px;
text-align:center;
letter-spacing:8px;
border:2px solid #ccc;
border-radius:12px;
margin-bottom:20px;
}
button{
width:100%;
padding:15px;
font-size:20px;
border:none;
border-radius:12px;
}

#resetConfirm{
background:#d60000;
color:#fff;
font-weight:bold;
}

#resetCancel{
margin-top:15px;
background:#777;
color:#fff;
}

</style>

</head>

<body>

<div id="app">

<div id="topScreen" class="screen active">

<img
id="topImage"
src="top.png.PNG"
alt="TOP">

<div id="adminArea"></div>

</div>

<div id="animation" class="screen">

<img
id="gachaMachine"
src="gacha_machine.png.PNG"
alt="ガチャマシン">

<div id="message">
抽選中…
</div>

</div>

<div id="resultScreen" class="screen">

<img
id="resultImage"
src=""
alt="Result">

</div>

<div id="resetOverlay">

<div id="resetBox">

<h2>管理者メニュー</h2>
<p id="countInfo"></p>
<input
type="password"
id="password"
maxlength="4"
placeholder="パスコード">

<button id="resetConfirm">
リセットする
</button>

<button id="resetCancel">
キャンセル
</button>

</div>

</div>

</div>

<script>

const topScreen=document.getElementById("topScreen");
const animation=document.getElementById("animation");
const resultScreen=document.getElementById("resultScreen");
const resultImage=document.getElementById("resultImage");

const adminArea=document.getElementById("adminArea");

const resetOverlay=document.getElementById("resetOverlay");
const password=document.getElementById("password");
const countInfo=document.getElementById("countInfo");
const resetConfirm=document.getElementById("resetConfirm");
const resetCancel=document.getElementById("resetCancel");

let playing=false;

let drawCount=parseInt(
localStorage.getItem("drawCount")||"0"
);

const prizes={

1:"prize2.png.PNG",
9:"prize3.png.PNG",
18:"prize2.png.PNG",
26:"prize3.png.PNG",
37:"prize3.png.PNG",
46:"prize2.png.PNG",
55:"prize1.png.PNG",
61:"prize3.png.PNG",
68:"prize3.png.PNG",
77:"prize2.png.PNG",
84:"prize3.png.PNG",
92:"prize2.png.PNG",
98:"prize3.png.PNG"

};

function showScreen(screen){

document
.querySelectorAll(".screen")
.forEach(s=>s.classList.remove("active"));

screen.classList.add("active");

}

function getPrize(){

drawCount++;

localStorage.setItem("drawCount",drawCount);

return prizes[drawCount]||"prize4.png.PNG";

}
function startGacha(){

if(playing)return;

playing=true;

showScreen(animation);

setTimeout(()=>{

const prize=getPrize();

resultImage.src=prize;

showScreen(resultScreen);

playing=false;

},2500);

}

topScreen.addEventListener("click",()=>{

startGacha();

});

resultImage.addEventListener("click",()=>{

showScreen(topScreen);

});

let adminTap=0;

let adminTimer;

adminArea.addEventListener("click",(e)=>{

e.stopPropagation();

adminTap++;

clearTimeout(adminTimer);

adminTimer=setTimeout(()=>{

adminTap=0;

},1500);

if(adminTap>=5){

adminTap=0;
countInfo.innerHTML=

"🎉 現在 <b>"+drawCount+"</b> 人目";
resetOverlay.style.display="flex";

password.value="";

}

});

resetCancel.addEventListener("click",()=>{

resetOverlay.style.display="none";

});

resetConfirm.addEventListener("click",()=>{

if(password.value==="1212"){

if(confirm("抽選回数をリセットしますか？")){

drawCount=0;

localStorage.setItem("drawCount","0");

resetOverlay.style.display="none";

alert("リセットしました！");

}

}else{

alert("パスコードが違います");

}

});

</script>

</body>
</html>
