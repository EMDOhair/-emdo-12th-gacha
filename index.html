<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">

<title>EMDO 12周年ガチャ</title>

<style>

*{

margin:0;

padding:0;

box-sizing:border-box;

-webkit-tap-highlight-color:transparent;

user-select:none;

}

html,

body{

width:100%;

height:100%;

overflow:hidden;
<div id="resetOverlay">

<div id="resetBox">

<h2>管理者メニュー</h2>

<input

type="password"

id="password"

maxlength="4"

placeholder="1212">

<button id="resetConfirm">

リセットする

</button>

<button id="resetCancel">

キャンセル

</button>

</div>

</div>

</div>

<script>

const topScreen=document.ge
function startGacha(){

    if(playing) return;

    playing=true;

    showScreen(animation);

    setTimeout(()=>{

        resultImage.src=getPrize();

        showScreen(resultScreen);

        playing=false;

    },2500);

}

topScreen.addEventListener("click",()=>{

    startGacha();

});

resultImage.addEventListener("click",()=>{

    showScreen(topScreen);

});

let adminTap=0;

let adminTimer;

adminArea.addEventListener("click",(e)=>{

    e.stopPropagation();

    adminTap++;

    clearTimeout(adminTimer);

    adminTimer=setTimeout(()=>{

        adminTap=0;

    },1500);

    if(adminTap>=5){

        adminTap=0;

        resetOverlay.style.display="flex";

        password.value="";

    }

});

resetCancel.addEventListener("click",()=>{

    resetOverlay.style.display="none";

});

resetConfirm.addEventListener("click",()=>{

    if(password.value==="1212"){

        if(confirm("抽選回数をリセットしますか？")){

            drawCount=0;

            localStorage.setItem("drawCount","0");

            resetOverlay.style.display="none";

            alert("リセットしました");

        }

    }else{

        alert("パスコードが違います");

    }

});

</script>

</body>

</html>
